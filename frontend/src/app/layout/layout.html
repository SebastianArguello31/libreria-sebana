<header class="barra">
  <a routerLink="/" class="marca">Biblioteca Sebana</a>

  <nav>
    <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    @if (esAdmin()) {
      <a routerLink="/admin/usuarios" routerLinkActive="activo">Usuarios</a>
      <a routerLink="/admin/prestamos" routerLinkActive="activo">Préstamos</a>
      <a routerLink="/admin/libros" routerLinkActive="activo">Libros</a>
    } @else if (usuario()?.rol === 'USUARIO') {
      <a routerLink="/mis-prestamos" routerLinkActive="activo">Mis préstamos</a>
    }
  </nav>

  <div class="sesion">
    @if (usuario(); as cuenta) {
      <span>{{ cuenta.nombreCompleto }}</span>
      <button type="button" class="secundario" (click)="salir()">Salir</button>
    } @else {
      <a class="boton-login" routerLink="/login" [queryParams]="{ returnUrl: '/' }">
        Iniciar sesión
      </a>
    }
  </div>
</header>

<main class="contenedor">
  <router-outlet />
</main>
